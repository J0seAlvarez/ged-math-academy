<header><b>🎓 GED Math Academy <span>· Cristóbal</span></b><div class="flex"><button class="light" id="lang" onclick="toggleLang()">Español / English</button><button class="light" onclick="renderHome()">Inicio</button></div></header>

<script>
const TOPICS=['Operaciones','Fracciones y porcentajes','Álgebra','Geometría','Gráficas y datos'];
const EN=['Operations','Fractions and percentages','Algebra','Geometry','Graphs and data'];
const Q=[
[0,0,'¿Cuánto es 8 + 7?','What is 8 + 7?',[13,15,16,17],1,'Suma las unidades.','Add the units.'],
[0,0,'¿Cuánto es 9 × 6?','What is 9 × 6?',[45,54,63,56],1,'Piensa en grupos iguales.','Think in equal groups.'],
[0,1,'Calcula 48 ÷ 6.','Calculate 48 ÷ 6.',[6,7,8,9],2,'Busca el número que multiplicado por seis da 48.','Find the number that times six makes 48.'],
[0,1,'¿Cuánto es −5 + 12?','What is −5 + 12?',[5,6,7,17],2,'Usa una recta numérica.','Use a number line.'],
[0,2,'Calcula 3 × (4 + 5).','Calculate 3 × (4 + 5).',[17,27,35,60],1,'Resuelve primero el paréntesis.','Work inside parentheses first.'],
[1,0,'¿Cuánto es 1/2 de 20?','What is 1/2 of 20?',[5,8,10,12],2,'Dividir entre dos encuentra la mitad.','Dividing by two finds half.'],
[1,0,'¿Qué decimal equivale a 1/4?','Which decimal equals 1/4?',[0.2,0.25,0.4,0.75],1,'Divide el numerador entre el denominador.','Divide numerator by denominator.'],
[1,1,'¿Cuánto es 20% de 80?','What is 20% of 80?',[8,12,16,20],2,'Expresa el porcentaje como decimal.','Write percent as a decimal.'],
[1,1,'Suma 1/2 + 1/4.','Add 1/2 + 1/4.',['1/4','2/6','3/4','1'],2,'Usa un denominador común.','Use a common denominator.'],
[1,2,'Una camisa de $60 tiene 25% de descuento. ¿Precio final?','A $60 shirt is 25% off. Final price?', [15,40,45,50],2,'Calcula el descuento y réstalo del precio original.','Find the discount and subtract it.'],
[2,0,'Si x + 5 = 12, ¿cuánto es x?','If x + 5 = 12, what is x?', [5,6,7,8],2,'Haz la operación inversa.','Use the inverse operation.'],
[2,0,'Si 3x = 18, ¿cuánto es x?','If 3x = 18, what is x?', [3,5,6,9],2,'Divide ambos lados por el mismo número.','Divide both sides by the same number.'],
[2,1,'Resuelve 2x + 4 = 16.','Solve 2x + 4 = 16.',[4,5,6,8],2,'Despeja primero 2x.','Isolate 2x first.'],
[2,1,'Simplifica 4x + 3x − 2x.','Simplify 4x + 3x − 2x.',['3x','5x','7x','9x'],1,'Agrupa términos semejantes.','Combine like terms.'],
[2,2,'Resuelve 5(x − 2) = 25.','Solve 5(x − 2) = 25.',[3,5,7,10],2,'Divide ambos lados entre cinco primero.','Divide both sides by five first.'],
[2,2,'Si y = 2x + 3 y x = 4, ¿cuánto es y?','If y = 2x + 3 and x = 4, what is y?', [8,9,11,14],2,'Sustituye el valor dado.','Substitute the given value.'],
[3,0,'Un cuadrado tiene lados de 5 cm. ¿Perímetro?','A square has 5 cm sides. Perimeter?', ['10 cm','15 cm','20 cm','25 cm'],2,'Suma los cuatro lados.','Add all four sides.'],
[3,0,'Un rectángulo mide 6 por 4. ¿Área?','A rectangle is 6 by 4. Area?',[10,20,24,28],2,'Multiplica largo por ancho.','Multiply length by width.'],
[3,1,'Un triángulo tiene base 10 y altura 6. ¿Área?','A triangle has base 10 and height 6. Area?',[16,25,30,60],2,'Calcula la mitad del rectángulo equivalente.','Find half the matching rectangle.'],
[3,1,'Un círculo tiene radio 3. Usando π ≈ 3.14, ¿área aproximada?','A circle has radius 3. Using π ≈ 3.14, approximate area?',[9.42,18.84,28.26,36],2,'Usa el radio al cuadrado.','Square the radius.'],
[3,2,'Un triángulo rectángulo tiene catetos 3 y 4. ¿Hipotenusa?','A right triangle has legs 3 and 4. Hypotenuse?',[5,6,7,8],0,'Aplica Pitágoras.','Use the Pythagorean theorem.'],
[4,0,'¿Cuál es la media de 2, 4 y 6?','What is the mean of 2, 4 and 6?',[3,4,5,6],1,'Suma los valores y divide entre tres.','Add the values and divide by three.'],
[4,0,'¿Cuál es la mediana de 1, 3, 9?','What is the median of 1, 3, 9?',[1,3,4,9],1,'Encuentra el valor central.','Find the middle value.'],
[4,1,'Hay 2 bolas rojas y 3 azules. ¿Probabilidad de roja?','There are 2 red balls and 3 blue. Probability of red?', ['1/5','2/5','3/5','2/3'],1,'Compara resultados favorables con el total.','Compare favorable outcomes with the total.'],
[4,1,'En y = 3x + 2, ¿cuál es la pendiente?','In y = 3x + 2, what is the slope?',[2,3,5,6],1,'Observa el coeficiente de x.','Look at the coefficient of x.'],
[4,2,'Para x = 1, 2, 3 y y = 4, 7, 10, ¿cuánto aumenta y por cada x?','For x = 1, 2, 3 and y = 4, 7, 10, how much does y increase per x?',[2,3,4,6],1,'Compara las diferencias entre valores sucesivos.','Compare changes between consecutive values.'],
[0,2,'Calcula (18 − 6) ÷ 3 + 2.','Calculate (18 − 6) ÷ 3 + 2.',[4,6,8,10],1,'Aplica el orden de operaciones.','Follow order of operations.'],
[1,2,'¿Cuánto es 0.6 × 0.5?','What is 0.6 × 0.5?',[0.03,0.3,1.1,3],1,'Multiplica como enteros y coloca el decimal.','Multiply as integers and place the decimal.'],
[2,2,'Resuelve 4x − 7 = 17.','Solve 4x − 7 = 17.',[4,5,6,8],2,'Despeja el término con x antes de dividir.','Isolate the x term before dividing.'],
[3,2,'Un prisma mide 2 × 3 × 5. ¿Volumen?','A prism measures 2 × 3 × 5. Volume?',[10,15,25,30],3,'Multiplica las tres dimensiones.','Multiply all three dimensions.']
];
let lang=localStorage.getItem('ged_lang')||'es',student=JSON.parse(localStorage.getItem('ged_student')||'null'),result=JSON.parse(localStorage.getItem('ged_result')||'null'),session=null,selected=null,feedback=false,chat=[];
const t=(es,en)=>lang==='es'?es:en, topic=i=>lang==='es'?TOPICS[i]:EN[i],app=()=>document.getElementById('app');
function save(){localStorage.setItem('ged_lang',lang);localStorage.setItem('ged_student',JSON.stringify(student));localStorage.setItem('ged_result',JSON.stringify(result))}
function toggleLang(){lang=lang==='es'?'en':'es';save();if(session)renderQuestion();else renderHome()}
function card(content){return '<section class="card">'+content+'</section>'}
function renderHome(){session=null;let h='<div class="hero"><span class="chip">GED Math · '+t('En español e inglés','Spanish and English')+'</span><h1>'+t('Aprende matemáticas con el Profesor Cristóbal','Learn math with Professor Cristóbal')+'</h1><p>'+t('Primero descubrimos lo que ya sabes. Después te enseñamos exactamente lo que necesitas para preparar el examen de matemáticas GED.','First we find out what you know. Then we teach exactly what you need to prepare for GED Math.')+'</p></div>';
h+=card('<h2>'+t('¡Descubre tu poder matemático!','Discover your math superpower!')+'</h2><p class="muted">'+t('20 retos cortos, sin reloj ni presión. Al final tendrás tu mapa de estudio.','20 bite-sized challenges, no clock or pressure. Get your personal study map.')+'</p><label>'+t('Tu nombre o apodo (no uses información confidencial)','Your name or nickname (do not enter sensitive information)')+'</label><input id="name" maxlength="45" value="'+escapeHTML(student?.name||'')+'" placeholder="'+t('Nombre','Name')+'"><div style="margin-top:15px"><button onclick="startTest()">'+t('¡Vamos! Empezar mi reto ✨','Let’s go! Start my challenge ✨')+'</button></div>');
if(result)h+=card('<div class="flex"><h2>'+t('Tu último resultado','Your last result')+'</h2><span class="chip">'+result.correct+'/'+result.answers.length+'</span></div><p>'+t('Continúa con tus lecciones y práctica personalizada.','Continue with personalized lessons and practice.')+'</p><button onclick="renderResults()">'+t('Ver mi plan','View my plan')+'</button> <button class="ghost" onclick="renderTeacher()">'+t('Practicar con Cristóbal','Practice with Cristóbal')+'</button>');
h+=card('<p class="math-eyebrow">'+t('Tu aventura matemática','Your math adventure')+'</p><div class="grid">'+['🧮','🍕','🔤','📐','📊'].map((e,i)=>'<div class="tile"><span class="emoji">'+e+'</span><strong>'+topic(i)+'</strong><span class="muted small">'+t('Aprende paso a paso','Learn step by step')+'</span></div>').join('')+'</div>');
h+=card('<h2>'+t('Para educadores','For educators')+'</h2><p class="muted">'+t('Este demostrador guarda datos solamente en este navegador. El panel escolar no contiene cuentas reales de estudiantes.','This demo saves data only in this browser. The school view does not contain real student accounts.')+'</p><button class="ghost" onclick="renderSchool()">'+t('Vista de escuela (demo)','School view (demo)')+'</button>');app().innerHTML=h}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startTest(){const name=document.getElementById('name').value.trim();if(!name){alert(t('Escribe un nombre o apodo.','Enter a name or nickname.'));return}student={name};save();const list=[];for(let a=0;a<5;a++)list.push(Q.findIndex(q=>q[0]===a&&q[1]===0));session={list,answers:[],level:[1,1,1,1,1],seen:new Set(list)};renderQuestion()}
function nextItem(){let i=session.answers.length;if(i>=20){finish();return}const area=i%5,lev=session.level[area];let ids=Q.map((q,j)=>({q,j})).filter(o=>o.q[0]===area&&!session.seen.has(o.j));if(!ids.length)ids=Q.map((q,j)=>({q,j})).filter(o=>!session.seen.has(o.j));if(!ids.length){finish();return}ids.sort((a,b)=>Math.abs(a.q[1]-lev)-Math.abs(b.q[1]-lev));session.list.push(ids[0].j);session.seen.add(ids[0].j)}
function renderQuestion(){if(!session)return;let i=session.answers.length;let id=session.list[i];if(id===undefined){nextItem();return}let q=Q[id];selected=null;feedback=false;app().innerHTML=card('<div class="flex"><span class="chip">'+t('Diagnóstico','Diagnostic')+' · '+(i+1)+'/20</span><span>'+topic(q[0])+'</span></div><progress value="'+i+'" max="20"></progress><h2>'+q[lang==='es'?2:3]+'</h2><div id="answers">'+q[4].map((v,j)=>'<button class="answer" id="a'+j+'" onclick="choose('+j+')">'+escapeHTML(v)+'</button>').join('')+'</div><div id="note" class="muted small">'+t('Selecciona una respuesta.','Choose one answer.')+'</div><button id="next" disabled onclick="submitAnswer()">'+t('Continuar','Continue')+'</button>')}
function choose(i){selected=i;document.querySelectorAll('.answer').forEach((el,j)=>el.classList.toggle('chosen',i===j));document.getElementById('next').disabled=false}
function submitAnswer(){const i=session.answers.length,qid=session.list[i],q=Q[qid];const correct=selected===q[5];session.answers.push({qid,choice:selected,correct});session.level[q[0]]=Math.max(0,Math.min(2,session.level[q[0]]+(correct?1:-1)));if(session.answers.length<20)nextItem();else {finish();return}renderQuestion()}
function finish(){let answers=session.answers;result={name:student.name,date:new Date().toISOString(),answers,correct:answers.filter(x=>x.correct).length};session=null;save();renderResults()}
function stats(){return TOPICS.map((_,i)=>{const a=result.answers.filter(x=>Q[x.qid][0]===i);return{topic:i,count:a.length,correct:a.filter(x=>x.correct).length,ratio:a.length?a.filter(x=>x.correct).length/a.length:0}})}
function renderResults(){if(!result){renderHome();return}const s=stats().sort((a,b)=>a.ratio-b.ratio),p=Math.round(result.correct/result.answers.length*100);let h=card('<span class="chip">'+t('Plan personalizado','Personalized learning plan')+'</span><h2>'+escapeHTML(result.name)+': '+p+'%</h2><p class="muted">'+t('Resultado educativo preliminar, no puntuación oficial GED.','Preliminary instructional score, not an official GED score.')+'</p><progress max="100" value="'+p+'"></progress><p>'+result.correct+' / '+result.answers.length+' '+t('respuestas correctas','correct answers')+'</p>');
h+=card('<h2>'+t('Tu mapa para dominar las matemáticas','Your math mastery map')+'</h2>'+s.map((x,j)=>'<div class="study"><b>'+ (j+1)+'. '+topic(x.topic)+'</b> — '+x.correct+'/'+x.count+' '+t('correctas','correct')+'<p class="muted">'+(x.ratio<.6?t('Prioridad: repasar conceptos y practicar.','Priority: review concepts and practice.'):t('Seguir practicando hasta dominar el tema.','Continue practicing toward mastery.'))+'</p><button class="ghost" onclick="renderTeacher('+x.topic+')">'+t('Practicar este tema','Practice this topic')+'</button></div>').join(''));
h+=card('<h2>'+t('Profesor Cristóbal','Professor Cristóbal')+'</h2><p>'+t('Te acompañaré paso a paso. Resolveremos tus dificultades antes de avanzar a preguntas más difíciles.','I will guide you step by step. We will work through gaps before advancing to harder questions.')+'</p><button onclick="renderTeacher('+s[0].topic+')">'+t('¡A practicar con Cristóbal!','Let’s practice with Cristóbal!')+'</button> <button class="ghost" onclick="renderHome()">'+t('Volver al inicio','Back home')+'</button>');app().innerHTML=h}
let practiceTopic=0,practiceId=null,practicePicked=null;
function renderTeacher(area){practiceTopic=area===undefined?(result?stats().sort((a,b)=>a.ratio-b.ratio)[0].topic:0):area;let ids=Q.map((q,i)=>({q,i})).filter(x=>x.q[0]===practiceTopic&&x.q[1]<=1);practiceId=ids[Math.floor(Math.random()*ids.length)].i;practicePicked=null;let q=Q[practiceId];app().innerHTML=card('<div class="flex"><span class="chip">👨‍🏫 Profesor Cristóbal</span><span>'+topic(practiceTopic)+'</span></div><h2>'+t('¡Hora de entrenar el cerebro!','Time for a brain workout!')+'</h2><div class="chat" id="chat"><div class="bubble bot">'+t('¡Hey! Soy Cristóbal 👋 Aquí los errores nos enseñan. ¡Tú puedes!','Hey! Cristóbal here 👋 Mistakes help us learn. You’ve got this!')+'</div><div class="bubble bot">'+q[lang==='es'?2:3]+'</div></div><div id="practice">'+q[4].map((v,i)=>'<button class="answer" onclick="checkPractice('+i+')">'+escapeHTML(v)+'</button>').join('')+'</div><p><button class="ghost" onclick="hint()">'+t('Dame una pista','Give me a hint')+'</button> <button class="ghost" onclick="renderTeacher('+practiceTopic+')">'+t('Otro ejercicio','Another exercise')+'</button> <button class="ghost" onclick="renderResults()">'+t('Mi plan','My plan')+'</button></p><div class="small muted">'+t('Demostración de tutor guiado. Conversación de IA en vivo disponible en una fase posterior.','Guided tutor demo. Live AI conversation is a future development phase.')+'</div>')}
function say(s,who='bot'){let d=document.createElement('div');d.className='bubble '+who;d.textContent=s;let box=document.getElementById('chat');box.appendChild(d);box.scrollTop=box.scrollHeight}
function hint(){say(Q[practiceId][lang==='es'?6:7])}
function checkPractice(i){if(practicePicked!==null)return;practicePicked=i;let q=Q[practiceId],good=i===q[5];say(String(q[4][i]),'student');say(good?t('¡Muy bien! Entendiste este ejercicio. Prueba otro para confirmar.','Well done! Try another to confirm your understanding.'):t('Todavía no. La respuesta es ','Not yet. The answer is ')+String(q[4][q[5]])+'. '+q[lang==='es'?6:7]);document.querySelectorAll('#practice .answer').forEach((el,j)=>{el.disabled=true;if(j===q[5])el.classList.add('correct');else if(j===i)el.classList.add('wrong')})}
function renderSchool(){let h=card('<h2>'+t('Panel de escuela — demostración local','School dashboard — local demo')+'</h2><p class="muted">'+t('No es un sistema de cuentas escolares: solo muestra las evaluaciones guardadas en este dispositivo. No usar para registros reales de estudiantes.','This is not a school account system: it shows only assessment data stored on this device. Do not use for real student records.')+'</p>');if(result)h+='<table><thead><tr><th>'+t('Estudiante','Student')+'</th><th>'+t('Puntuación','Score')+'</th><th>'+t('Fecha','Date')+'</th></tr></thead><tbody><tr><td>'+escapeHTML(result.name)+'</td><td>'+result.correct+'/'+result.answers.length+'</td><td>'+escapeHTML(result.date.slice(0,10))+'</td></tr></tbody></table><p><button class="ghost" onclick="exportCSV()">'+t('Exportar CSV local','Export local CSV')+'</button></p>';else h+='<p>'+t('Todavía no hay resultados en este navegador.','No results in this browser yet.')+'</p>';h+='</section>';app().innerHTML=h}
function exportCSV(){if(!result)return;const rows=['name,date,correct,total','"'+result.name.replace(/"/g,'""')+'",'+result.date+','+result.correct+','+result.answers.length];let b=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='ged-demo-results.csv';a.click();URL.revokeObjectURL(url)}
renderHome();
</script></body></html>
